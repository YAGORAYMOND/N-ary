    async function ensureSampleBuffer(url) {
        if (window.sampleBufferCache[url]) {
            return window.sampleBufferCache[url];
        }

        if (!window.sampleBufferLoads[url]) {
            window.sampleBufferLoads[url] = Tone.ToneAudioBuffer.fromUrl(url)
                .then(buffer => {
                    window.sampleBufferCache[url] = buffer;
                    delete window.sampleBufferLoads[url];
                    return buffer;
                })
                .catch(error => {
                    delete window.sampleBufferLoads[url];
                    throw error;
                });

        return window.sampleBufferLoads[url];

    //// rotate per a track params
    function getTrackRotate(
        params,
        paramName
    ) {
        const value =
            params
                .__trackModifiers
                ?.[paramName]
                ?.rotate
                ?.[0];

        const rotate =
            parseInt(value);

        return Number.isInteger(rotate)
            ? rotate
            : 0;
    }

   
    //////////////////////////////
    // 2. EL MOTOR (Nary Engine)
    /////////////////////////////
    const nary = {
        fluxParams: {},

        //Sequenciador per posició en la barra
        //inclou la opció/funció "rotate"
        getRegionValue: (
            value,
            eventPosition = 0,
            rotate = 0,
            iterationOverride = null
        ) => {

            if (value === undefined)
                return undefined;

            const values =
                value
                    .toString()
                    .trim()
                    .split(/\s+/);

            if (values.length === 1)
                return values[0];

            const region =
                Math.min(
                    Math.floor(
                        eventPosition *
                        values.length
                    ),
                    values.length - 1
                );

            const rotateAmount =
                parseInt(rotate) || 0;

            const ctx =
                window.currentTrackContext;

            const iteration =
                iterationOverride !== null
                    ? iterationOverride
                    : (window.loopIterations[ctx?.id] || 0);

            const rotatedRegion =
                (
                    region +
                    rotateAmount *
                    iteration
                );
        
            const index =
                (
                    (rotatedRegion % values.length)
                    + values.length
                ) % values.length; //funcioina tmb amb rotate < 0

            return values[index];
        },

        triggerFlux: (
            id,
            params,
            time,
            ignoreActivity = false,
            eventPosition = 0 //per poder definir els parametres que li toquen al sample
        ) => {
            window.currentTrackContext = {
                id,
                params
            };
            const sourceName = params.source?.trim();
            if (!sourceName) {
                statusError("Missing source");
                statusUpdate();
                return;
            }  
            if (!window.samples[sourceName]) {
                return;
            }
            const shimmer = params.shimmer ? parseFloat(params.shimmer) : 0;
            const scatter = params.scatter ? parseFloat(params.scatter) : 0;
            const harmonics = [1, 2, 1.5, 0.75, 4];
            const activity =
                params.activity
                    ? parseFloat(
                        nary.getRegionValue(
                            params.activity,
                            eventPosition,
                            getTrackRotate(params, "activity")
                        )
                    )
                    : 1;
                if (
                    !ignoreActivity &&
                    Math.random() > activity
                )
                    return;
                
                harmonics.forEach((h, i) => {
                    // La probabilitat de veus extra depèn del shimmer i el scatter
                    if (i > 0 && Math.random() > (shimmer + scatter) / 2) return;

                    // L'essència del SCATTER: un desplaçament en el temps que no afecta la nota base (i=0)
                    const delay = i === 0 ? 0 : Math.random() * (scatter * 0.3);
                    const sampleTime = time + delay;

                    // Actualitzar els pedals segons la posició de l'event.
                    const trackFX = window.trackFX[id];
                    
                    const envelope = new Tone.Gain(0);

                    if (trackFX) {
                        envelope.connect(trackFX.input);
                    } else {
                        envelope.toDestination();
                    }

                    const sampleUrl = window.samples[sourceName];
                    const sampleBuffer = window.sampleBufferCache[sampleUrl];

                    if (!sampleBuffer) {
                        console.warn(`Sample buffer not loaded: ${sourceName}`);
                        return;
                    }
                    
                    const player = new Tone.Player({
                        url: sampleBuffer,
                        autostart: false
                    });
                
                    //pitch
                    const p =
                        parseFloat(
                            nary.getRegionValue(
                                params.pitch,
                                eventPosition, //posició event defineix pitch
                                getTrackRotate(params, "pitch")
                            )
                        ) || 0;
                    const detune = (Math.random() * 0.1 - 0.05) * shimmer;
                    player.playbackRate = (Math.pow(2, p / 12) * h) + detune;
                    
                    //len
                    const duration =
                        params.len
                            ? parseFloat(
                                nary.getRegionValue(
                                    params.len,
                                    eventPosition, //posicio del event defineix len
                                    getTrackRotate(params, "len")
                                )
                            )
                            : null;

                    const panner = new Tone.Panner(0).connect(envelope);
                    player.connect(panner);
                    
                    //VOLUM DELS SAMPLES (gain)
                    const gain =
                        parseFloat(
                            nary.getRegionValue(
                                params.gain,
                                eventPosition,
                                getTrackRotate(params, "gain")
                            ) ?? 1
                        );

                    //A GESTIONAR, QUAN TOQUI/CREI ELS PEDALS SHIMMER I SCATTER
                    const vol =
                        gain *
                        (i === 0
                            ? 1.3
                            : (0.7 / i) * (shimmer + scatter));
                    
                    //Envelope (ha donat molts problemes de clicks als samples, despres d'investigar així es robust)
                    if (duration !== null) {
                        envelope.gain.setValueAtTime(0, sampleTime);
                        envelope.gain.linearRampToValueAtTime(
                            vol,
                            sampleTime + 0.03
                        );
                        envelope.gain.setValueAtTime(
                            vol,
                            sampleTime + duration - 0.03
                        );
                        envelope.gain.linearRampToValueAtTime(
                            0,
                            sampleTime + duration
                        );
                    } else {
                        envelope.gain.setValueAtTime(
                            vol,
                            sampleTime
                        );
                    }

                    player.start(sampleTime);

                    if (duration !== null) {
                        player.stop(sampleTime + duration );
                    }

                    const playbackDuration =
                        player.buffer.duration / player.playbackRate;

                    const cleanupTime =
                        duration !== null
                            ? duration + 2
                            : playbackDuration + 2;

                    setTimeout(() => {
                        const index =
                            window.activePlayers.indexOf(player);
                        if (index !== -1)
                            window.activePlayers.splice(index, 1);
                        player.dispose();
                        panner.dispose();
                        envelope.dispose();
                    }, cleanupTime * 1000);                            
                        
                    window.activePlayers.push(player);
                });
            },
        createFlux: (id, params) => {
            const sourceName = params.source?.trim();
            if (!sourceName)
                return;
            if (!window.samples[sourceName]) 
                return;

            Tone.getDestination().volume.value = 0; 

            // PEDALBOARD
            const effectDefs = params.__effects || [];
            const currentTrackFX = window.trackFX[id];

            if (!samePedalTopology(currentTrackFX, effectDefs)) {

                // Si ha canviat l'ordre o el nombre de pedals,
                // deixem morir naturalment la cadena antiga.
                if (currentTrackFX) {
                    retireTrackFX(currentTrackFX);
                }

                // Nova cadena exactament en l'ordre del codi.
                window.trackFX[id] = buildTrackFX(effectDefs);

            } else {

                // Si la topologia és la mateixa, mantenim els mateixos
                // nodes i només actualitzem les definicions.
                currentTrackFX.effects.forEach((effect, i) => {
                    effect.setDefinition(effectDefs[i]);
                });
            }

            // Valor inicial dels pedals.
            const currentDuration =
                naryUI.durations[id] || 5;

            const automationStartSeconds =
                Tone.Transport.seconds;

            const automationBaseCycle =
                Math.floor(
                    automationStartSeconds / currentDuration
                );

            const initialPedalPosition =
                (automationStartSeconds % currentDuration) /
                currentDuration;

            const pedalAutomation =
                window.trackFX[id].effects.map(effect => ({
                    effect,
                    positions:
                        getPedalAutomationPositions(
                            effect.definition
                        )
                }));

            // Situar els pedals a la regió actual del loop.
            window.trackFX[id].effects.forEach(effect => {
                effect.update(
                    initialPedalPosition,
                    undefined,
                    0
                );
            });

            window.loopIterations[id] = 0; //per calcular el n de iteració per al rotate
            const interval = 1/120; // 120 Hz de precisió fixa per defecte

            //control d'esdeveniments a sonar (barra)
            let previousTransportSeconds =
                Tone.Transport.seconds;

            const loop = new Tone.Loop(time => {
            // Sincronització amb la barra visual (si està activa)
            if (naryUI.events[id]) {
                const currentTransportSeconds =
                    Tone.Transport.seconds;
                const startTime =
                    previousTransportSeconds;
                const endTime =
                    currentTransportSeconds;
                const startCycle =
                    Math.floor(
                        startTime / currentDuration
                    );
                const endCycle =
                    Math.floor(
                        endTime / currentDuration
                    );

                // Automatització contínua dels pedals,
                // independent dels events del track.
                for (const automation of pedalAutomation) {
                    for (const pedalPosition of automation.positions) {
                        for (
                            let cycle = startCycle;
                            cycle <= endCycle;
                            cycle++
                        ) {
                            const absolutePedalTime =
                                cycle * currentDuration +
                                pedalPosition * currentDuration;

                            if (
                                absolutePedalTime > startTime &&
                                absolutePedalTime <= endTime
                            ) {
                                const iteration =
                                    Math.max(
                                        0,
                                        cycle - automationBaseCycle
                                    );

                                automation.effect.update(
                                    pedalPosition,
                                    time,
                                    iteration
                                );
                            }
                        }
                    }
                }

                naryUI.events[id].forEach(evPos => {
                    const eventTime =
                        evPos * currentDuration;

                    for (
                        let cycle = startCycle;
                        cycle <= endCycle;
                        cycle++
                    ) {
                        const absoluteEventTime =
                            cycle * currentDuration +
                            eventTime;
                        if (
                            absoluteEventTime > startTime &&
                            absoluteEventTime <= endTime
                        ) {
                            nary.triggerFlux(
                                id,
                                params,
                                time,
                                false,
                                evPos
                            );
                        }
                    }
                });

                //contador de cicles a +1
                if (endCycle > startCycle) {
                     window.loopIterations[id] +=
                        endCycle - startCycle;
                }
          
                previousTransportSeconds =
                    currentTransportSeconds;
            }
            }, interval).start(0);
            
            activeLoops[id] = loop;

            statusActive(id); 
        }
    };

    // =====================================================
    // NOU SISTEMA DE PEDALS
    // Helpers que treballen directament amb
    // una instància concreta d'efecte de l'AST.
    // =====================================================

    // Retorna els valors d'un pedal com string,
    // perquè getRegionValue() continuï treballant
    // com fins ara.
    //
    // Ex:
    // delay 1 dt 100 500
    //
    // getPedalValues(effectDef)
    // -> "1"
    //
    // getPedalValues(effectDef, "dt")
    // -> "100 500"
    function getPedalValues(
        effectDef,
        paramName = null
    ) {

        const values =
            paramName === null
                ? effectDef?.values
                : effectDef?.[paramName];

        if (!Array.isArray(values)) {
            return undefined;
        }

        return values.join(" ");
    }


    // Retorna el rotate de LA INSTÀNCIA CONCRETA
    // del pedal.
    //
    // Això permetrà tenir:
    //
    // delay ... rotate 1
    // delay ... rotate -1
    //
    // sense confondre els dos delays.
    function getPedalRotate(
        effectDef,
        paramName = null
    ) {

        const value =
            paramName === null
                ? effectDef
                    ?.modifiers
                    ?.rotate
                    ?.[0]

                : effectDef
                    ?.paramModifiers
                    ?.[paramName]
                    ?.rotate
                    ?.[0];

        const rotate =
            parseInt(value);

        return Number.isInteger(rotate)
            ? rotate
            : 0;
    }

    function getPedalAutomationPositions(effectDef) {
        const positions = new Set();

        const addValues = values => {
            if (!Array.isArray(values) || values.length <= 1) return;

            for (let i = 0; i < values.length; i++) {
                positions.add(i / values.length);
            }
        };

        addValues(effectDef?.values);

        for (const [key, values] of Object.entries(effectDef || {})) {
            if (
                key === "values" ||
                key === "type" ||
                key === "modifiers" ||
                key === "paramModifiers" ||
                key.endsWith("_glide")
            ) {
                continue;
            }

            addValues(values);
        }

        return [...positions].sort((a, b) => a - b);
    }    

    const pedalFactory = {

        create(effectDef) {
            if (!effectDef) return null;

            switch (effectDef.type) {
                case "delay":
                    return this.createDelay(effectDef);

                case "lpf":
                    return this.createLpf(effectDef);

                case "reverb":
                    return this.createReverb(effectDef);

                default:
                    console.warn(`Unknown pedal type: ${effectDef.type}`);
                    return null;
            }
        },


        // DELAY
        createDelay(effectDef) {
            const input = new Tone.Gain();
            const output = new Tone.Gain();

            const node = new Tone.FeedbackDelay({
                wet: 1,
                maxDelay: 10
            });

            const wetGain = new Tone.Gain(0);

            // dry
            input.connect(output);

            // wet
            input.connect(node);
            node.connect(wetGain);
            wetGain.connect(output);

            return {
                type: "delay",

                input,
                output,
                node,
                wetGain,

                definition: structuredClone(effectDef),

                setDefinition(newDefinition) {
                    this.definition = structuredClone(newDefinition);
                },

                update(
                    eventPosition = 0,
                    time = undefined,
                    iterationOverride = null
                ) {
                    const startTime = time ?? Tone.now();

                    // Amount
                    const delayAmount = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition),
                            eventPosition,
                            getPedalRotate(this.definition),
                            iterationOverride
                        ) || 0
                    );

                    wetGain.gain.rampTo(
                        Math.max(0, Math.min(delayAmount, 1)),
                        0.02,
                        startTime
                    );

                    // dt_glide
                    const delayTimeGlide = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition, "dt_glide"),
                            eventPosition,
                            getPedalRotate(this.definition, "dt_glide"),
                            iterationOverride
                        ) || 0.3
                    );

                    // dt
                    const delayTime = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition, "dt"),
                            eventPosition,
                            getPedalRotate(this.definition, "dt"),
                            iterationOverride
                        ) || 400
                    );

                    node.delayTime.rampTo(
                        delayTime / 1000,
                        Math.max(0, delayTimeGlide),
                        startTime
                    );

                    // feedback
                    const feedback = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition, "dfb"),
                            eventPosition,
                            getPedalRotate(this.definition, "dfb"),
                            iterationOverride
                        ) || 0.5
                    );

                    node.feedback.value = Math.max(0, Math.min(feedback, 1));
                },

                dispose() {
                    input.dispose();
                    node.dispose();
                    wetGain.dispose();
                    output.dispose();
                }
            };
        },


        // LPF
        createLpf(effectDef) {
            const input = new Tone.Gain();
            const node = new Tone.Filter(22050, "lowpass");
            const output = new Tone.Gain();

            input.connect(node);
            node.connect(output);

            return {
                type: "lpf",

                input,
                output,
                node,

                definition: structuredClone(effectDef),

                setDefinition(newDefinition) {
                    this.definition = structuredClone(newDefinition);
                },
                
                update(
                    eventPosition = 0,
                    time = undefined,
                    iterationOverride = null
                ) {
                    const startTime = time ?? Tone.now();

                    const cutoff = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition),
                            eventPosition,
                            getPedalRotate(this.definition),
                            iterationOverride
                        ) || 22050
                    );

                    const glide = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(this.definition, "lpf_glide"),
                            eventPosition,
                            getPedalRotate(this.definition, "lpf_glide"),
                            iterationOverride
                        ) || 0.03
                    );

                    node.frequency.rampTo(
                        Math.max(20, Math.min(cutoff, 22050)),
                        Math.max(0, glide),
                        startTime
                    );
                },

                dispose() {
                    input.dispose();
                    node.dispose();
                    output.dispose();
                }
            };
        },

        // REVERB
        createReverb(effectDef) {
            const input = new Tone.Gain();
            const output = new Tone.Gain();

            // Paràmetres interns estàtics.
            // De moment només es llegeix el primer valor.
            const getStaticValue = (definition, key, fallback) => {
                const value =
                    parseFloat(definition?.[key]?.[0]);

                return Number.isFinite(value)
                    ? value
                    : fallback;
            };

            const getSize = definition =>
                Math.max(
                    0,
                    Math.min(
                        getStaticValue(definition, "size", 0.7),
                        1
                    )
                );

            // Mapping provisional:
            // size 0 → 0.5 s
            // size 1 → 15 s
            const sizeToDecay = definition =>
                0.5 + getSize(definition) * 14.5;

            const getPredelay = definition =>
                Math.max(
                    0,
                    getStaticValue(
                        definition,
                        "predelay",
                        30
                    )
                ) / 1000; // ms → s


            let currentDecay =
                sizeToDecay(effectDef);

            let currentPredelay =
                getPredelay(effectDef);


            const reverbNode =
                new Tone.Reverb({
                    decay: currentDecay,
                    preDelay: currentPredelay,
                    wet: 0
                });


            input.connect(reverbNode);
            reverbNode.connect(output);


            return {
                type: "reverb",

                input,
                output,
                reverbNode,

                definition:
                    structuredClone(effectDef),


                setDefinition(newDefinition) {
                    this.definition =
                        structuredClone(newDefinition);

                    const nextDecay =
                        sizeToDecay(newDefinition);

                    const nextPredelay =
                        getPredelay(newDefinition);

                    // size i predelay són estàtics:
                    // només canvien amb Ctrl+Enter.
                    if (nextDecay !== currentDecay) {
                        currentDecay = nextDecay;
                        reverbNode.decay = currentDecay;
                    }

                    if (
                        nextPredelay !== currentPredelay
                    ) {
                        currentPredelay = nextPredelay;
                        reverbNode.preDelay =
                            currentPredelay;
                    }

                    // damp queda reservat per al
                    // futur reverb algorítmic.
                },


                update(
                    eventPosition = 0,
                    time = undefined,
                    iterationOverride = null
                ) {
                    const startTime =
                        time ?? Tone.now();

                    // Només reverb amount és
                    // modulable en aquesta implementació.
                    const amount = parseFloat(
                        nary.getRegionValue(
                            getPedalValues(
                                this.definition
                            ),
                            eventPosition,
                            getPedalRotate(
                                this.definition
                            ),
                            iterationOverride
                        ) ?? 0
                    );

                    reverbNode.wet.rampTo(
                        Math.max(
                            0,
                            Math.min(amount, 1)
                        ),
                        0.05,
                        startTime
                    );
                },


                dispose() {
                    input.dispose();
                    reverbNode.dispose();
                    output.dispose();
                }
            };
        }

    };



    function buildTrackFX(effectDefs = []) {
        const input = new Tone.Gain();
        const output = new Tone.Gain();

        const effects = effectDefs
            .map(effectDef => pedalFactory.create(effectDef))
            .filter(Boolean);

        let currentNode = input;

        for (const effect of effects) {
            currentNode.connect(effect.input);
            currentNode = effect.output;
        }

        currentNode.connect(output);
        output.toDestination();

        return {
            input,
            output,
            effects
        };
    }

    function samePedalTopology(trackFX, effectDefs = []) {
        if (!trackFX) return false;
        if (trackFX.effects.length !== effectDefs.length) return false;

        return trackFX.effects.every((effect, i) =>
            effect.type === effectDefs[i].type &&
            typeof effect.setDefinition === "function"
        );
    }

    function retireTrackFX(trackFX) {
        if (!trackFX) return;

        trackFX.effects.forEach(effect => {
            if (effect.type === "delay" && effect.node?.feedback) {
                effect.node.feedback.rampTo(0, 10);
            }
        });

        setTimeout(() => {
            trackFX.effects.forEach(effect => {
                if (typeof effect.dispose === "function") {
                    effect.dispose();
                } else {
                    effect.input?.dispose();
                    effect.node?.dispose();
                    effect.wetGain?.dispose();
                    effect.output?.dispose();
                }
            });

            trackFX.input?.dispose();
            trackFX.output?.dispose();
        }, 15000);
    }

    const naryUI = {

        injectBar: function(id, lineIndex) {

            if (!this.events[id]) {

            }

            // Si aquesta ID no té cap durada assignada encara, li donem 5s per defecte

            canvas.width = 300;
            canvas.height = 18;
            canvas.style.cssText = 'background: #000; border: 1px solid #555; border-radius: 3px; display: block;';
            canvas.addEventListener('click', () => {

            container.appendChild(canvas);

            this.widgets[id] = editor.addLineWidget(lineIndex, container, {

                noHScroll: true,
                above: true
            });

            this.startAnimation(id, canvas);
        },

        //crea les barres de esdeveniments
        startAnimation: function(id, canvas) {
            const ctx = canvas.getContext('2d');
            const draw = () => {
                if (!document.body.contains(canvas)) {
                    return;
                }
                requestAnimationFrame(draw);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (naryUI.selectedId === id) {
                    ctx.strokeStyle = '#FFEB3B';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
                }
                else {
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(0, 0, canvas.width, canvas.height);
                }
                
                //Cada capçal utilitza la seva pròpia durada independent per moure's
                const currentDuration = this.durations[id] || 5;
                const progress = (Tone.Transport.seconds % currentDuration) / currentDuration;
                const headX = progress * canvas.width;

                // Fa que errase ('e') nomes funcioni sobre la barra que toca 
                if (
                    this.isEraseActive &&
                    this.eraseId === id
                ) {
                    this.events[id] = this.events[id].filter(
                        ev => Math.abs(ev - progress) > 0.03
                    );

                    ctx.fillStyle = 'rgba(244, 67, 54, 0.4)';
                    ctx.fillRect(headX - 6, 0, 12, canvas.height);
                }

                // Dibuixar línies blanques de la seva pròpia memòria
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                if (this.events[id]) {
                    this.events[id].forEach(ev => {
                        ctx.beginPath(); ctx.moveTo(ev * canvas.width, 0); ctx.lineTo(ev * canvas.width, canvas.height); ctx.stroke();
                    });
                }

                //linea vermella si esta en mode "d" i blanca sino
                ctx.strokeStyle =
                    (this.isEraseActive && this.eraseId === id)
                        ? '#f44336'
                        : '#FFEB3B';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(headX, 0); ctx.lineTo(headX, canvas.height); ctx.stroke();
            };
            draw();


        }
    };

    //HELPERS DEL PARSER:

    // Elimina comentaris //,
    // però respecta els // dins de "..." (URLs)
    function stripLineComment(line) {
        let inQuotes = false;
        let escaped = false;

        for (
            let i = 0;
            i < line.length - 1;
            i++
        ) {
            const char = line[i];
            if (escaped) {
                escaped = false;
                continue;
            }
            if (char === "\\") {
                escaped = true;
                continue;
            }
            if (char === '"') {
                inQuotes = !inQuotes;
                continue;
            }
            if (
                !inQuotes &&
                char === "/" &&
                line[i + 1] === "/"
            ) {
                return line.slice(0, i);
            }
        }
        return line;
    }    

    // elimina les cometes d'un string
    function removeQuotes(value) {
        if (
            value?.startsWith('"') &&
            value?.endsWith('"')
        ) {
            return value.slice(1, -1);
        }
        return value;
    }    

    // Separa el text en tokens
    function tokenize(code) {
        let tokens = [];
        // Separem el text en línies
        const lines = code.split("\n");
        // Recorrem cada línia
        for (let i = 0; i < lines.length; i++) {
            // Número de línia (comença a 1)
            const lineNumber = i + 1;
            // Eliminem comentaris:
            // tot el que hi ha després de // fins al final de la línia
            let line = stripLineComment(lines[i]);
            // Separem els >
            line = line.replace(/>/g, " > ");
            // Separem els tokens
            let lineTokens = line.split(/\s+/);
            // Eliminem tokens buits
            lineTokens = lineTokens.filter(token => token !== "");
            // Afegim el token amb el seu número de línia
            for (let token of lineTokens) {
                tokens.push({
                    value: token,
                    line: lineNumber,
                    consumed: false
                });
            }
        }
        return tokens;
    }

    //detectar paràmetres globals
    function isGlobalParam(token) {
        return GLOBAL_PARAMS.has(token);
    }

    //detectar modificadors de paràmetre
        function isParamModifier(token) {
            return PARAM_MODIFIERS.has(token);
        }

    //detectar parametre de track
    function isTrackParam(token) {
        return TRACK_PARAMS.has(token);
    }

    //detectar effect types
    function isEffectType(token) {
        return EFFECT_TYPES.has(token);
    }

    //detectar effect params
    function isEffectParam(token) {
        for (const effect in EFFECT_PARAMS) {
            if (EFFECT_PARAMS[effect].has(token)) {
                return true;
            }
        }
        return false;
    }

    //detecta valors numerics
    function isNumericValue(value) {
        return (
            value !== "" &&
            !Number.isNaN(
                Number(value)
            )
        );
    }

    //obte la regla de inici del parametre
    function getValueRule(keyword) {

        return (
            VALUE_RULES[keyword] || {
                numericOnly: true,
                maxValues: Infinity
            }
        );
    }

    //Per gestionar multivalors despres d'un token
    function consumeValuesUntilKeyword(startPosition, keyword){
        let values = [];
        // Comencem pel token següent al paràmetre
        let position = startPosition + 1;
        //Consumir tokens
        const startLine =
            parser.tokens[startPosition].line;
        //verificar regla del parametre
        const rule =
            getValueRule(keyword);
        // Recorrem els tokens següents
        while (position < parser.tokens.length) {
            const token = parser.tokens[position];

            // Els valors d'un paràmetre pertanyen
            // a la mateixa línia que el paràmetre.
            if (token.line !== startLine) {
                break;
            }
            // Si trobem un GLOBAL_PARAM, parem
            if (isGlobalParam(token.value)) {
                break;
            }
            // Si trobem un modificador
            // del paràmetre anterior, parem
            if (isParamModifier(token.value)) {
                break;
            }
            // Si trobem un TRACK_PARAM, parem
            if (isTrackParam(token.value)) {
                break;
            }
            // Si trobem un EFFECT_TYPE, parem
            if (isEffectType(token.value)) {
                break;
            }
            // Si trobem un EFFECT_PARAM, parem
            if (isEffectParam(token.value)) {
                break;
            }

            // Si el següent token és >, és un TRACK HEADER
            const nextToken = parser.tokens[position + 1];
            if (nextToken && nextToken.value === ">") {
                break;
            }

            // Si trobem un >, parem
            if (token.value === ">") {
                break;
            }

            // Un paràmetre numèric NO consumeix paraules.
            if (rule.numericOnly && !isNumericValue( token.value )) {
                break;
            }

            // Guardem el valor
            token.consumed = true;
            values.push(token.value);

            // source, loop, etc. (parametres q nomes accepten 1 valor)
            // poden limitar el nombre de valors acceptats
            if (values.length >= rule.maxValues) {
                break;
            }               

            // Passem al següent token
            position++;
        }
        return values;
    }

    function consumeSingleValue(startPosition) {
        const startToken =
            parser.tokens[startPosition];
        const valueToken =
            parser.tokens[startPosition + 1];
        if (!valueToken) {
            return [];
        }
        // El valor ha d'estar
        // a la mateixa línia
        if (
            valueToken.line !==
            startToken.line
        ) {
            return [];
        }
        // No consumir una keyword
        if (
            isGlobalParam(valueToken.value) ||
            isParamModifier(valueToken.value) ||
            isTrackParam(valueToken.value) ||
            isEffectType(valueToken.value) ||
            isEffectParam(valueToken.value) ||
            valueToken.value === ">"
        ) {
            return [];
        }
        valueToken.consumed = true;
        return [
            valueToken.value
        ];
    }    

    //Warnings del parser
    function addWarning(message, line){
        parser.warnings.push({
            message,
            line
        });
    }

    //Parser
    const parser = {
        tokens: [],
        position: 0,
        currentId: null,
        currentEffect: null,
        currentTarget: null,
        tracks: [],
        globals: {},
        directives: [],
        warnings: [],

        peek() {
            return this.tokens[this.position];
        },

        next() {
            const token = this.tokens[this.position];
            this.position++;
            return token;
        },

        //end of funcion
        eof() {
            return this.position >= this.tokens.length;
        }
    };

    function parse() {
        while (!parser.eof()) {
            const token = parser.peek();
            if (token.consumed) {
                parser.next();
                continue;
            }
            // Mirem el següent token sense consumir-lo
            const nextToken = parser.tokens[parser.position + 1];

            // Comprova si tenim un repo
            if (token.value === "repo") {
                token.consumed = true;
                parser.currentTarget = null;
                const valueToken =
                    parser.tokens[
                        parser.position + 1
                    ];
                if (
                    valueToken &&
                    valueToken.line ===
                        token.line
                ) {
                    valueToken.consumed = true;
                    parser.directives.push({
                        type: "repo",
                        value:
                            removeQuotes(
                                valueToken.value
                            ),
                        line: token.line
                    });
                }
                parser.next();
                continue;
            }

            // Comprova si tenim un import
            if (token.value === "import") {
                token.consumed = true;
                parser.currentTarget = null;
                const nameToken =
                    parser.tokens[parser.position + 1];
                const urlToken =
                    parser.tokens[parser.position + 2];
                if (
                    nameToken &&
                    urlToken &&
                    nameToken.line === token.line &&
                    urlToken.line === token.line
                ) {
                    nameToken.consumed = true;
                    urlToken.consumed = true;

                    parser.directives.push({
                        type: "import",
                        name: nameToken.value,
                        url:
                            removeQuotes(urlToken.value),
                        line: token.line
                    });
                }
                parser.next();
                continue;
            }


            // Comprova si tenim un paràmetre global
            if (isGlobalParam(token.value)) {
                token.consumed = true;
                parser.currentTarget = null;
                const values =
                    consumeValuesUntilKeyword(
                        parser.position,
                        token.value
                    );
                parser.globals[token.value] =
                    values;
                parser.next();
                continue;
            }

            // Comprovem si tenim: trackheader (>)
            if (nextToken && nextToken.value === ">") {
                token.consumed = true;
                nextToken.consumed = true;
                parser.currentId = token.value;

                parser.currentEffect = null;
                parser.currentTarget = null;       

                parser.tracks.push({
                    id: parser.currentId,
                    line: token.line,
                    params: {},
                    modifiers: {},
                    effects: []
                });
                
                parser.next();
                continue;
            }

            // Comprova si tenim: track param
            if (isTrackParam(token.value)) {
                token.consumed = true;
                const value = parser.tokens[parser.position + 1];
                const currentTrack = parser.tracks.at(-1);
                if (value) {
                    const values =
                        consumeValuesUntilKeyword(
                            parser.position,
                            token.value
                        );
                    currentTrack.params[token.value] =
                        values;

                    // source i loop no són
                    // paràmetres seqüenciables
                    if (
                        token.value === "source" ||
                        token.value === "loop"
                    ) {
                        parser.currentTarget = null;
                    }
                    else {
                        parser.currentTarget = {
                            kind: "trackParam",
                            track: currentTrack,
                            key: token.value
                        };
                    }
                }
                parser.next();
                continue;
            }

            //comprova si tenim: effect type
            if (isEffectType(token.value)) {
                token.consumed = true;
                const currentTrack = parser.tracks.at(-1);
                parser.currentEffect = {
                    type: token.value,
                    values:
                        consumeValuesUntilKeyword(
                            parser.position,
                            token.value
                        ),
                    modifiers: {},
                    paramModifiers: {}
                };
                parser.currentTarget = {
                    kind: "effectValue",
                    effect: parser.currentEffect
                };
                currentTrack.effects.push(
                    parser.currentEffect
                );
                parser.next();
                continue;
            }

            //comprovar si tenim: effect params
            if (isEffectParam(token.value)) {
                token.consumed = true;
                parser.currentEffect[token.value] =
                    consumeValuesUntilKeyword(
                        parser.position, 
                        token.value);
                parser.currentTarget = {
                    kind: "effectParam",
                    effect: parser.currentEffect,
                    key: token.value
                };
                parser.next();
                continue;
            }

            // Modificador aplicat
            // al paràmetre anterior
            if (isParamModifier(token.value)) {
                token.consumed = true;
                const values = consumeSingleValue(parser.position);
                const value = values[0];

                // rotate necessita
                // un paràmetre anterior
                if (!parser.currentTarget) {
                    addWarning(
                        `rotate has no parameter to modify`,
                        token.line
                    );
                    parser.next();
                    continue;
                }

                // rotate ha de ser enter
                if (
                    value === undefined ||
                    !Number.isInteger(
                        Number(value)
                    )
                ) {
                    addWarning(
                        `rotate expects an integer`,
                        token.line
                    );
                    parser.next();
                    continue;
                }
                const target =
                    parser.currentTarget;

                // TRACK PARAM
                if (
                    target.kind ===
                    "trackParam"
                ) {
                    if (!target.track.modifiers[target.key]
                    ) {
                        target.track.modifiers[target.key] = {};
                    }

                    target.track.modifiers[target.key].rotate =values;
                }

                // EFFECT TYPE VALUE
                else if (
                    target.kind ===
                    "effectValue"
                ) {
                    target.effect.modifiers.rotate =values;
                }

                // EFFECT PARAM
                else if (
                    target.kind ===
                    "effectParam"
                ) {
                    if (
                        !target.effect.paramModifiers[target.key]
                    ) {
                        target.effect.paramModifiers[target.key] = {};
                    }
                    target.effect.paramModifiers[target.key].rotate = values;
                }
                parser.next();
                continue;
            }

            // Si queda un identificador no consumit
            // dins d'un track, el considerem
            // un paràmetre desconegut.
            if (
                parser.currentId &&
                !token.consumed &&
                /^[a-zA-Z_]\w*$/.test(token.value)
            ) {
                addWarning(
                    `Unknown parameter '${token.value}'`,
                    token.line
                );
            }
            
            // Consumim el token actual
            parser.next();
        }
    }
    ///////////////////

    //FUNCIÓ TEST PARSER (TEMPORAL)
    window.testParser = function(){
        const code = editor.getValue();
        parser.tokens = tokenize(code);
        parser.position = 0;
        parser.currentId = null;
        parser.currentEffect = null;
        parser.currentTarget = null;
        parser.tracks = [];
        parser.globals = {};
        parser.directives = [];
        parser.warnings = [];
        parse();
        console.log(parser.tracks);
    }

    // Converteix només els TRACK PARAMS de l'AST
    // al format que consumeix actualment el motor.
    // TEMPORAL durant la integració.
    function compileTrackParams(track) {
        const params = {};
        for (const [key, values] of Object.entries(track.params)) {
            params[key] = values.join(" ");
        }
        return params;
    }

    function compileTrackForEngine(track) {
        const params =
            compileTrackParams(track);

        // Modificadors dels TRACK_PARAMS
        // mentre aquests encara es consumeixen com params plans.
        params.__trackModifiers =
            structuredClone(
                track.modifiers || {}
            );

        // Pedals complets, mantenint
        // ordre, valors i modificadors.
        params.__effects =
            structuredClone(
                track.effects || []
            );

        return params;
    }

   
    // 6. EXECUCIÓ (Amb el reset de volum corregit)
    async function execute() {
        console.log("Comandament EXECUTE rebut");
        logElement.innerText = "EXECUTING...";

        statusReset();
        
        //netejar load samples (pq no es tornin a carregar)
        window.samples = {
            ...window.preloadSamples //afegim les samples per defecte
        };
        window.repo = "";
        
        await Tone.start();

        reload(); //no fem stop sino reload perque no pari el rellotge intern
        
        // Eliminar params de tracks
        // de l'execució anterior
        nary.fluxParams = {};

        Tone.getDestination().volume.value = 0; 
        

        const code = editor.getValue();
        
        ////////////////////
        // PARSER PER TOKENS
        ////////////////////
        parser.tokens = tokenize(code);
        parser.position = 0;
        parser.currentId = null;
        parser.currentEffect = null;
        parser.currentTarget = null;
        parser.tracks = [];
        parser.globals = {};
        parser.directives = [];
        parser.warnings = [];
        parse();

        // Passar els warnings del parser nou
        // al sistema de log de N-ary
        for (const warning of parser.warnings) {
            statusWarning(
                warning.message,
                warning.line
            );
        }

        // AST actual del codi executat
        window.currentAST = structuredClone(parser.tracks);

        // Eliminar barres de tracks que ja no existeixen
        // en l'AST actual
        const currentTrackIds =
            new Set(
                window.currentAST.map(
                    track => track.id
                )
            );
        for (
            const [id, widget]
            of Object.entries(naryUI.widgets)
        ) {
            if (!currentTrackIds.has(id)) {

                if (
                    widget &&
                    typeof widget.clear === "function"
                ) {
                    widget.clear();
                }
                delete naryUI.widgets[id];
                if (naryUI.selectedId === id) {
                    naryUI.selectedId = null;
                }
            }
        }

        // Crear les barres directament des de l'AST
        for (const track of window.currentAST) {

            const loopValue =
                track.params.loop?.[0];

            if (loopValue !== undefined) {
                naryUI.durations[track.id] =
                    parseFloat(loopValue);
            }
            naryUI.injectBar(
                track.id,
                track.line - 1
            );
        }

        // Aplicar directives del parser
        // respectant l'ordre del codi
        for (
            const directive
            of parser.directives
        ) {
            // REPO
            if (directive.type === "repo") {
                window.repo = directive.value;
                continue;
            }

            // IMPORT
            if (directive.type === "import") {
                window.samples[directive.name] =
                    window.repo
                        ? `${window.repo}/${directive.url}`
                        : directive.url;
                console.log("Imported:", directive.name);
                continue;
            }
        }

        // PRELOAD DELS BUFFERS
        const usedSampleUrls = [
            ...new Set(
                window.currentAST
                    .map(track => track.params.source?.[0])
                    .map(sourceName => window.samples[sourceName])
                    .filter(Boolean)
            )
        ];

        await Promise.all(
            usedSampleUrls.map(url => ensureSampleBuffer(url))
        );        

        // Crear els tracks del motor
        // directament des de l'AST
        for (const track of window.currentAST) {
            const params =
                compileTrackForEngine(track);
            // Validar source
            if (!params.source) {
                statusError(
                    `Track "${track.id}" has no source`,
                    track.line
                );
            }
            else if (!window.samples[params.source]) {
                statusError(
                    `Sample "${params.source}" not found`,
                    track.line
                );
            }
            // Params que consumeix actualment el motor
            nary.fluxParams[track.id] = {
                ...params
            };
            // Crear el flux
            nary.createFlux(
                track.id,
                params
            );
        }

        if (Tone.Transport.state === "stopped") {
            Tone.Transport.start();
        }
        
        statusUpdate();
    }

    // 6. STOP (Més net)
   function stop() {
        console.log("Comandament STOP rebut");
        logElement.innerText = "STOPPED";

        // Aturem el transport de Tone.js
        Tone.Transport.stop();
        Tone.Transport.cancel();

        // Netegem tots els bucles d'àudio actius utilitzant la llista correcta
        if (window.activeLoops) {
            Object.values(activeLoops).forEach(loop => {
                loop.stop();
                loop.dispose();
            });
        }


        window.activeLoops = {}; // Reiniciem el magatzem de bucles

        //netejar els objectes PEDALS/EFFECTS morts perque no s'acumulin
        const oldTrackFX = window.trackFX;
        window.trackFX = {};

        Object.values(oldTrackFX).forEach(track => {
            retireTrackFX(track);
        });

        // NETEJA DE LES BARRES INTERACTIVES (NaryUI)
        if (window.naryUI) {
            // Esborrem físicament tots els canvas de la pantalla
            Object.values(naryUI.widgets).forEach(w => {
                if (w && typeof w.clear === 'function') w.clear();
            });
            
            // Reiniciem la memòria visual i de ritmes
            naryUI.widgets = {};
            naryUI.events = {};
        }
    }

    //7. RELOAD: Esborra els loops i els esdeveniments pero no para el rellotge (per quan refas ctrl+enter)
    function reload() {
        console.log("Comandament RELOAD rebut");
        // eliminem esdeveniments programats
        Tone.Transport.cancel();
        // eliminem loops antics
        if (window.activeLoops) {
            Object.values(activeLoops).forEach(loop => {
                loop.stop();
                loop.dispose();
            });
        }
        
        window.activeLoops = {};
    }

    // Per si fas clic fora de l'editor, que els shortcuts funcionin igual
    document.addEventListener('keydown', e => {

        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            execute();
        }

        if (e.ctrlKey && e.key === '.') {
            e.preventDefault();
            stop();
        }

        // CTRL + Ç → comentar/descomentar línia
        if (
            e.ctrlKey &&
            (e.key === 'ç' || e.key === 'Ç')
        ) {
            e.preventDefault();

            const cursor = editor.getCursor();
            const lineNumber = cursor.line;
            const line = editor.getLine(lineNumber);

            const indentation =
                line.match(/^\s*/)?.[0] || "";

            const content =
                line.slice(indentation.length);

            // Si ja està comentada → descomentar
            if (content.startsWith("//")) {

                editor.replaceRange(
                    content.slice(2),
                    {
                        line: lineNumber,
                        ch: indentation.length
                    },
                    {
                        line: lineNumber,
                        ch: line.length
                    }
                );

            }

            // Si no → comentar
            else {

                editor.replaceRange(
                    "//" + content,
                    {
                        line: lineNumber,
                        ch: indentation.length
                    },
                    {
                        line: lineNumber,
                        ch: line.length
                    }
                );

            }
        }

    });
 

</script>
